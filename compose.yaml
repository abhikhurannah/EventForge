services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:3001:3001"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/eventforge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-to-at-least-32-random-characters}
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: development
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["npm", "run", "start:worker"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/eventforge
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: .
    command: ["npm", "run", "dev:web", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  mongo-data:
  redis-data:
